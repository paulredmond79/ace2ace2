[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ace-bridge"
version = "0.1.0"
description = "Raspberry Pi bridge: ACE Pro ↔ ACE 2 Pro protocol translator for Anycubic Kobra 3 V2"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "pyusb>=1.2.1",
    "typer[all]>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "black>=24.0",
    "types-pyserial",
    "types-PyYAML",
]

[project.scripts]
bridge = "ace_bridge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ace_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers -v"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "ANN", "RUF"]
ignore = [
    "B008",   # typer.Option/Argument in defaults is the standard Typer pattern
]

[tool.black]
line-length = 100
target-version = ["py312"]
